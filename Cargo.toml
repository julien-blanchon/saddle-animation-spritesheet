[package]
name = "saddle-animation-spritesheet"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/julien-blanchon/saddle-animation-spritesheet"
license = "MIT-0"
description = "Spritesheet animation state machine for Bevy 2D sprites"

[dependencies]
bevy = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
