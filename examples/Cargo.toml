[workspace]
members = [
    "support",
    "basic",
    "aseprite_import",
    "state_machine",
    "frame_events",
    "crowd_variation",
    "directional",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = "0.18"
saddle-animation-spritesheet = { path = ".." }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
